<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Sift: a planet at the edge of its light. The crescent is the sunlit
       limb, brightest at the top right; the night side stays just visible. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b1d"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="night" cx=".62" cy=".38" r=".75">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset=".6" stop-color="#0e0e10"/>
      <stop offset="1" stop-color="#060607"/>
    </radialGradient>
    <linearGradient id="limb" x1=".86" y1=".14" x2=".2" y2=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".38" stop-color="#d4d4d7"/>
      <stop offset=".72" stop-color="#7d7d82"/>
      <stop offset="1" stop-color="#3a3a3e"/>
    </linearGradient>
    <linearGradient id="rim" x1=".85" y1=".15" x2=".15" y2=".85">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="512" cy="512" r="272" fill="#fff"/>
      <circle cx="480" cy="544" r="236" fill="#000"/>
    </mask>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="halo" color-interpolation-filters="sRGB" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="tileclip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <g clip-path="url(#tileclip)">
    <!-- atmosphere: the lit limb, blurred, spilling just past the edge -->
    <g filter="url(#halo)" opacity=".5">
      <circle cx="512" cy="512" r="272" fill="url(#limb)" mask="url(#crescent)"/>
    </g>
    <circle cx="512" cy="512" r="272" fill="url(#night)"/>
    <circle cx="512" cy="512" r="271" fill="none" stroke="url(#rim)" stroke-width="2"/>
    <circle cx="512" cy="512" r="272" fill="url(#limb)" mask="url(#crescent)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
