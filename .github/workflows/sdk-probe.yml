name: SDK probe (temporary)

on:
  pull_request:
    paths: [.github/workflows/sdk-probe.yml]

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: New window, titlebar and glass API in the macOS 26.5 SDK
        run: |
          sdk="$(DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer xcrun --sdk macosx --show-sdk-path)"
          h="$sdk/System/Library/Frameworks/AppKit.framework/Headers"
          echo "--- 26.x availability in window/toolbar/titlebar/glass headers"
          grep -n "macos(26\|macOS(26\|26\.0" "$h"/NSWindow.h "$h"/NSToolbar.h "$h"/NSToolbarItem.h "$h"/NSTitlebarAccessoryViewController.h "$h"/NSView.h "$h"/NSButton.h | head -80
          echo "--- NSGlassEffectView.h"
          sed -n 1,200p "$h"/NSGlassEffectView.h
          echo "--- any header mentioning Glass"
          grep -l -i "glass" "$h"/*.h
          grep -n -i "glass" "$h"/*.h | grep -v NSGlassEffectView.h | head -40
          echo "--- Info.plist design keys"
          grep -rn "UIDesignRequiresCompatibility\|DesignRequiresCompatibility" "$h" | head
